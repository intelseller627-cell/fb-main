<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/><title>fb-main admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,sans-serif;background:#0B0E14;color:#F2F4F8;padding:16px;max-width:960px;margin:0 auto}
h1{font-size:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:#161A23;border:1px solid #262c3a;border-radius:14px;padding:14px;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.stat{background:#161A23;border:1px solid #262c3a;border-radius:12px;padding:10px;text-align:center}.stat b{display:block;font-size:22px}.stat span{font-size:11px;color:#8A93A6}
input,textarea{width:100%;background:#1E2330;border:1px solid #262c3a;border-radius:10px;color:#F2F4F8;padding:10px;margin:6px 0;font:inherit}textarea{min-height:110px;font-family:ui-monospace,monospace;font-size:12px}
button{border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer;background:#242A3A;color:#F2F4F8;font:inherit;font-weight:700;font-size:13px}button.p{background:#1877F2}button.d{background:transparent;border:1px solid #FF5470;color:#FF5470}button:disabled{opacity:.5}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;background:#242A3A;color:#8A93A6}.ok{background:rgba(0,212,170,.16);color:#00D4AA}.bad{background:rgba(255,84,112,.16);color:#FF5470}.warn{background:rgba(240,185,11,.16);color:#F0B90B}
.sub{font-size:12px;color:#8A93A6;margin-top:4px;line-height:1.5;word-break:break-all}.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#242A3A;padding:10px 16px;border-radius:10px;display:none;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}td,th{text-align:left;padding:6px;border-bottom:1px solid #262c3a}
@media(max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="login" class="card" style="max-width:380px;margin:12vh auto">
  <h1>fb-main admin</h1><div class="sub">Enter the ADMIN_PASSWORD from Railway.</div>
  <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password"/>
  <button class="p" id="goLogin" style="width:100%">Sign in</button>
</div>
<div id="app" style="display:none">
  <div class="row"><h1>fb-main · Facebook accounts</h1><div><button id="refresh">Refresh</button> <button id="logout">Sign out</button></div></div>
  <div class="stats" id="stats"></div>
  <div class="card"><b>Add my own account</b>
    <div class="sub">Log in to Facebook in a desktop browser, export cookies as JSON (must include c_user and xs), paste here. Stored encrypted. Accounts you add here are tagged "Admin".</div>
    <input id="aLabel" maxlength="60" placeholder="Label, e.g. My main"/><textarea id="aState" spellcheck="false" autocomplete="off" placeholder='[{"key":"c_user","value":"..."}, ...]'></textarea>
    <button class="p" id="addBtn">Connect account</button></div>
  <div class="sub" id="caps"></div>
  <div id="list"></div>
</div>
<div id="msg"></div>
<script src="/admin/app.js"></script>
</body></html>
